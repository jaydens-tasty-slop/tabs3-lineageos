<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tab S3 browser checks</title>
<style>body{font:18px system-ui;background:#171d25;color:#e8f0fa;margin:24px}canvas,video{max-width:100%;width:480px;border:1px solid #718197}pre{white-space:pre-wrap;font-size:14px}li{padding:3px}button{font:inherit;padding:12px}#layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#layout>div{padding:8px;background:#253141}</style>
<h1>Tab S3 browser checks</h1><p>Generated graphics and video. Results are sent only to the PC on your LAN.</p>
<button id="start">Run checks</button><div id="layout"><div>Touch and scroll</div><div>Responsive layout</div></div>
<canvas id="canvas2d" width="64" height="64"></canvas><video id="video" muted playsinline controls></video>
<pre id="status">Ready</pre><ol id="items"></ol>
<script>
const run=new URLSearchParams(location.search).get('run');
const results={run,user_agent:navigator.userAgent,device_pixel_ratio:devicePixelRatio,tests:[],videos:[],errors:[]};
const status=document.getElementById('status');
async function emit(kind,data){const r=await fetch('/result?run='+encodeURIComponent(run),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,...data})});if(!r.ok)throw Error('Report rejected');}
async function test(name,fn){try{const details=await fn();results.tests.push({name,passed:true,details});}catch(e){results.tests.push({name,passed:false,error:String(e)});}status.textContent=JSON.stringify(results,null,2);}
function assert(ok,message){if(!ok)throw Error(message);}
function shader(gl,type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);assert(gl.getShaderParameter(s,gl.COMPILE_STATUS),gl.getShaderInfoLog(s));return s;}
async function graphics(kind){const c=document.createElement('canvas');c.width=64;c.height=64;document.body.insertBefore(c,status);const gl=c.getContext(kind,{preserveDrawingBuffer:true});assert(gl,kind+' unavailable');
const modern=kind==='webgl2';const vs=modern?'#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}':'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=modern?'#version 300 es\nprecision mediump float;out vec4 color;void main(){color=vec4(.25,.5,.75,1.);}':'precision mediump float;void main(){gl_FragColor=vec4(.25,.5,.75,1.);}';
const program=gl.createProgram();gl.attachShader(program,shader(gl,gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl,gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);assert(gl.getProgramParameter(program,gl.LINK_STATUS),gl.getProgramInfoLog(program));gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const attr=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);
const pixel=new Uint8Array(4);gl.readPixels(32,32,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);assert([64,128,191,255].every((x,i)=>Math.abs(pixel[i]-x)<=2),'Shader pixels differ: '+pixel);assert(gl.getError()===gl.NO_ERROR,'GL error');
const debug=gl.getExtension('WEBGL_debug_renderer_info');let frames=0;const began=performance.now();await new Promise(resolve=>{function frame(t){gl.drawArrays(gl.TRIANGLES,0,3);frames++;if(t-began<2000)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame);});assert(frames>=10,'Animation did not advance');
const details={version:gl.getParameter(gl.VERSION),renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),pixel:Array.from(pixel),animation_frames:frames,elapsed_ms:performance.now()-began};gl.deleteBuffer(buffer);gl.deleteProgram(program);return details;}
async function videoCase(name,mime){const v=document.getElementById('video');const capability=v.canPlayType(mime);const result={name,mime,can_play_type:capability};await emit('video-start',{name});
if(!capability){result.supported=false;result.status='browser_format_not_advertised';results.videos.push(result);await emit('video-end',result);return;}
result.supported=true;let frames=0,ended=false;const started=performance.now();let pixel=null,resolveEnd,lastSample=-1;const pixelSamples=[];const finish=new Promise(resolve=>resolveEnd=resolve);v.muted=true;v.autoplay=true;v.src='/media/'+name+'.mp4';
const end=()=>{ended=true;resolveEnd();};const fail=()=>resolveEnd();v.addEventListener('ended',end,{once:true});v.addEventListener('error',fail,{once:true});const timer=setTimeout(resolveEnd,35000);
if(v.requestVideoFrameCallback){const count=()=>{frames++;const bucket=Math.floor(v.currentTime/5);if(v.currentTime>=1&&v.videoWidth&&bucket>lastSample){lastSample=bucket;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);const p=[[.25,.25],[.75,.25],[.25,.75],[.75,.75]].map(([x,y])=>Array.from(ctx.getImageData(Math.floor(c.width*x),Math.floor(c.height*y),1,1).data));pixel=p.flat();const valid=p.every(q=>q[3]===255)&&p[0][0]>180&&p[0][1]<80&&p[0][2]<80&&p[1][1]>150&&p[1][0]<80&&p[1][2]<80&&p[2][2]>180&&p[2][0]<80&&p[2][1]<80&&p[3].slice(0,3).every(q=>q>180);pixelSamples.push({time:v.currentTime,quadrants:p,coarse_color_check_passed:valid});}if(!ended)v.requestVideoFrameCallback(count);};v.requestVideoFrameCallback(count);}
try{await v.play();await finish;}catch(e){result.error=String(e);}clearTimeout(timer);
const quality=v.getVideoPlaybackQuality?v.getVideoPlaybackQuality():null;Object.assign(result,{ended,current_time:v.currentTime,duration:v.duration,width:v.videoWidth,height:v.videoHeight,frame_callbacks:frames,playback_ms:performance.now()-started,total_video_frames:quality?quality.totalVideoFrames:null,dropped_frames:quality?quality.droppedVideoFrames:null,sampled_video_rgba:pixel,media_error:v.error?{code:v.error.code,message:v.error.message}:null});
result.pixel_samples=pixelSamples;result.pixel_check_scope='Coarse generated quadrant colors and opaque pixels, not HDR or exact colorimetry';result.passed=ended&&v.currentTime>=19&&v.videoWidth===1920&&frames>=200&&pixelSamples.length>=3&&pixelSamples.every(p=>p.coarse_color_check_passed);v.pause();v.removeAttribute('src');v.load();v.removeEventListener('ended',end);v.removeEventListener('error',fail);results.videos.push(result);await emit('video-end',result);status.textContent=JSON.stringify(results,null,2);}
let startupPoll=null,startupExpiry=null;let started=false;async function main(){if(started||document.visibilityState!=='visible'||innerWidth<=0||innerHeight<=0)return;started=true;if(startupPoll!==null){clearInterval(startupPoll);startupPoll=null;}if(startupExpiry!==null){clearTimeout(startupExpiry);startupExpiry=null;}document.removeEventListener('visibilitychange',main);results.viewport=[innerWidth,innerHeight];results.visibility_at_start=document.visibilityState;document.getElementById('start').disabled=true;try{await emit('start',{user_agent:navigator.userAgent,viewport:results.viewport,visibility:document.visibilityState});
await test('dom_css_canvas',()=>{const items=document.getElementById('items');for(let i=0;i<250;i++){const li=document.createElement('li');li.textContent='Generated row '+i;items.appendChild(li);}assert(items.children.length===250,'DOM count differs');const columns=getComputedStyle(document.getElementById('layout')).gridTemplateColumns;assert(columns.split(' ').length===2&&columns.split(' ').every(w=>parseFloat(w)>0),'Grid layout differs');const ctx=document.getElementById('canvas2d').getContext('2d');ctx.fillStyle='#20a060';ctx.fillRect(0,0,64,64);const p=ctx.getImageData(32,32,1,1).data;assert(p[0]===32&&p[1]===160&&p[2]===96,'Canvas pixels differ');return {rows:250,grid:columns,pixel:Array.from(p)};});
await test('local_storage',()=>{const key='tabs3-validation-'+run;localStorage.setItem(key,'generated');const valid=localStorage.getItem(key)==='generated';localStorage.removeItem(key);assert(valid,'Storage round trip differs');return {removed:true};});
await test('webassembly',async()=>{const bytes=new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);const {instance}=await WebAssembly.instantiate(bytes);const sum=instance.exports.add(19,23);assert(sum===42,'Wasm result differs');return {sum};});
await test('web_worker',()=>new Promise((resolve,reject)=>{const blob=new Blob(['let total=0;for(let i=0;i<65536;i++)total+=i;postMessage(total);'],{type:'text/javascript'});const url=URL.createObjectURL(blob);const worker=new Worker(url);const timer=setTimeout(()=>{worker.terminate();URL.revokeObjectURL(url);reject(Error('Worker timeout'));},10000);worker.onmessage=e=>{clearTimeout(timer);worker.terminate();URL.revokeObjectURL(url);if(e.data===2147450880)resolve({sum:e.data});else reject(Error('Worker result differs'));};worker.onerror=e=>{clearTimeout(timer);worker.terminate();URL.revokeObjectURL(url);reject(Error(e.message));};}));
await test('webgl',()=>graphics('webgl'));await test('webgl2',()=>graphics('webgl2'));
await videoCase('avc-high-1080p60-moving','video/mp4; codecs="avc1.64002a"');
await videoCase('hevc-main-1080p60-moving','video/mp4; codecs="hvc1.1.6.L123.B0"');
results.completed=true;results.passed=results.tests.every(t=>t.passed)&&results.videos[0].passed===true&&results.videos.filter(v=>v.supported).every(v=>v.passed);await emit('complete',results);status.textContent=JSON.stringify(results,null,2);
}catch(e){results.errors.push(String(e));status.textContent=JSON.stringify(results,null,2);try{await emit('failure',results);}catch(ignored){}}}
document.getElementById('start').onclick=main;document.addEventListener('visibilitychange',main);startupPoll=setInterval(main,500);startupExpiry=setTimeout(()=>{if(startupPoll!==null){clearInterval(startupPoll);startupPoll=null;}startupExpiry=null;},180000);
</script></html>
